{% extends 'openpage/base_post.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
            <div class="container">
                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                    <div class="col">
                        <div class="card shadow-sm">
                            {% if post.preview %}
                                <img src="{{ post.preview.url }}" alt="{{ post.title }}">
                            {% endif %}
                            <div class="card-body">
                                <p class="card-text">Заголовок: {{ object.title }}</p>
                                <p class="card-text">Содержимое: {{ object.content }}</p>
                                <p class="card-text">Дата публикации: {{ object.creation_date }}</p>
                                <p class="card-text">Счетчик: {{ object.view_count }}</p>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="btn-group">
                                        <a class="btn btn-primary" href="{% url 'openpage:post_list' %}" role="button">Назад</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
